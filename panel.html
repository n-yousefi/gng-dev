<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GIG Components</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="toolbar">
      <button id="refreshButton" type="button" title="Refresh component tree">Refresh</button>
      <button id="selectedElementButton" type="button" title="Find the component containing the selected Elements node">Find $0</button>
      <div class="segmented-filter" role="group" aria-label="Component owner filter">
        <button class="filter-button active" type="button" data-filter="all">All</button>
        <button class="filter-button" type="button" data-filter="components">Components</button>
        <button class="filter-button" type="button" data-filter="gng">GNG</button>
      </div>
      <input id="searchInput" type="search" placeholder="Search selector, class, path, attributes" />
      <button id="indexRefreshButton" class="index-refresh-button is-missing" type="button" title="Refresh component index" aria-label="Refresh component index">
        <span class="refresh-icon" aria-hidden="true">&#8635;</span>
      </button>
      <span id="statusText" class="status">Idle</span>
      <span id="indexMeta" class="index-meta">No index</span>
      <label class="toggle" title="Outline selected or hovered components on the inspected page.">
        <input id="highlightToggle" type="checkbox" />
        <span>Highlight on page</span>
      </label>
    </header>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <main class="shell">
      <aside class="tree-pane">
        <div class="pane-title">
          <span>Components</span>
          <span class="pane-title-actions">
            <span id="changeSummary" class="change-summary hidden"></span>
            <button id="clearFocusButton" class="clear-focus-button hidden" type="button" title="Show full component tree">Clear focus</button>
            <span id="componentCount" class="muted">0</span>
          </span>
        </div>
        <div id="pinnedPane" class="pinned-pane hidden">
          <div class="pinned-title">Pinned</div>
          <div id="pinnedList" class="pinned-list"></div>
        </div>
        <div id="treeRoot" class="tree-root empty">Click Refresh to scan the inspected page.</div>
      </aside>

      <section class="details-pane">
        <div id="emptyDetails" class="empty-details">
          Select a component to inspect its attributes, metadata, and template.
        </div>

        <div id="detailsContent" class="details-content hidden">
          <div class="details-header">
            <div>
              <div class="details-title-row">
                <h1 id="detailsTitle"></h1>
                <div id="detailsBadges" class="badges"></div>
              </div>
            </div>
          </div>

          <nav class="tabs" aria-label="Details tabs">
            <button class="tab active" type="button" data-tab="overview">Overview</button>
            <button class="tab" type="button" data-tab="changes">Changes</button>
          </nav>

          <section id="tab-overview" class="tab-panel active"></section>
          <section id="tab-changes" class="tab-panel"></section>
        </div>
      </section>
    </main>

    <div id="contextMenu" class="context-menu hidden">
      <button type="button" class="context-menu-item" data-action="copySubTree">Copy Sub Tree</button>
    </div>

    <script src="source-loader.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
